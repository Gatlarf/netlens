# Build Netlens from this source tree instead of pulling the published image (for developers).
#
#   export NETLENS_VERSION="$(sh tools/version.sh)"
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Without NETLENS_VERSION the app still works, it just reports the version as "dev".

services:
  netlens:
    build:
      context: .
      args:
        NETLENS_VERSION: ${NETLENS_VERSION:-dev}
    image: netlens:local
