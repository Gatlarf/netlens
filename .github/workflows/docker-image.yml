name: Test, build and publish Docker image

# Runs the test suite on every push and pull request. On pushes to main (and v* tags) the
# image is published to ghcr.io/<owner>/netlens, but only if the tests pass.
# Version = <major.minor from VERSION file>.<commits since VERSION last changed> (contrib/version.sh), so it rises with every build.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["plugin-index/**"]
  pull_request:
    paths-ignore: ["plugin-index/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: python -m pytest -q

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the commit count is correct

      - id: ver
        run: echo "version=$(sh contrib/version.sh)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          labels: |
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.ver.outputs.version }}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: NETLENS_VERSION=${{ steps.ver.outputs.version }}
          sbom: true                      # an SBOM attestation made from the image layers, attached to the image in the registry
          provenance: mode=max            # and a SLSA provenance attestation (what was built, from which commit, by which workflow)
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The SBOM of the application as it runs (Python packages with licences, the vendored browser libraries with SHA-256, the operating-system packages),
      # in both standard formats, kept with the build. The same document is available from a running Netlens: Settings, or GET /api/sbom.
      - name: SBOM of the application (CycloneDX and SPDX)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          IMAGE=$(echo "$TAGS" | grep -m1 ":${VERSION}$")
          docker run --rm --entrypoint python "$IMAGE" -m app.sbom > "netlens-${VERSION}.cdx.json"
          docker run --rm --entrypoint python "$IMAGE" -m app.sbom --format spdx > "netlens-${VERSION}.spdx.json"

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ steps.ver.outputs.version }}
          path: netlens-*.json
