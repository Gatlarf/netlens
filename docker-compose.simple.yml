# Netlens: the simplest way to run it. No .env file, no folders to create, no token.
#
#   docker compose -f docker-compose.simple.yml up -d
#
# Then open http://<this-device>:8080 and follow the first-start steps (you create your own account).
# Works the same in Portainer (Stacks > Add stack > Web editor: paste this file) and in Synology Container Manager
# (Project > Create). Your data lives in the Docker volume "netlens-data" and survives updates and re-creating the container.
#
# The three lines that matter are network_mode, cap_drop and cap_add. They belong to the netlens service itself (same indentation as "image:"),
# not to "environment:". Without them the container starts but cannot scan. In a container form: Network = host, Capabilities = NET_RAW and NET_ADMIN on.
#
# Optional: set TZ to your time zone (for example Europe/Brussels) so times in e-mails and charts match your clock.

services:
  netlens:
    image: ghcr.io/gatlarf/netlens:latest
    container_name: netlens
    restart: unless-stopped
    # Host networking is required to see the devices on your network (ARP, mDNS, SSDP). The web page is on port 8080 of this device.
    network_mode: host
    cap_drop:
      - ALL
    cap_add:                    # same level as "image:" (not under "environment:")
      - NET_RAW
      - NET_ADMIN
    # Only if scans fail with "dnet: Failed to open device" although NET_RAW and NET_ADMIN are set AND `docker exec netlens getcap /usr/bin/nmap` prints nothing
    # (some Synology / NAS set-ups drop the file capability nmap needs as a normal user): run as root and add DAC_OVERRIDE to cap_add above. This is weaker than the
    # default (the whole app then holds NET_ADMIN, not only nmap); read the README, Troubleshooting, before using it.
    # user: "0:0"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - netlens-data:/data
    environment:
      - TZ=${TZ:-UTC}
      # Rarely needed: NETLENS_BIND=0.0.0.0:8081 if port 8080 is taken on this device.

volumes:
  netlens-data:
