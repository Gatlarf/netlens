# NetLens using the pre-built image from GitHub Container Registry.
# No source code or Dockerfile needed, so this works in the Portainer web editor.
# This file keeps your data in a host folder ($DOCKERDIR/appdata/netlens). Most people want the simpler docker-compose.simple.yml instead.
#
# Variables (.env file or the stack's environment variables):
#   DOCKERDIR      required: host folder for app data; create $DOCKERDIR/appdata/netlens and
#                  run: sudo chown 10001:10001 $DOCKERDIR/appdata/netlens
#   NETLENS_TOKEN  optional: a shared admin token (openssl rand -hex 32); empty = create your account in the first-start wizard

services:
  netlens:
    image: ghcr.io/gatlarf/netlens:latest
    container_name: netlens
    restart: unless-stopped
    # Host networking is required for ARP/L2 discovery and mDNS/SSDP.
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
      - NET_ADMIN
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ${DOCKERDIR:?Set DOCKERDIR}/appdata/netlens:/data
    environment:
      - TZ=${TZ:-UTC}
      # Optional since 0.2.50: leave NETLENS_TOKEN empty and create your account in the first-start wizard.
      - NETLENS_TOKEN=${NETLENS_TOKEN:-}
      - NETLENS_BIND=${NETLENS_BIND:-0.0.0.0:8080}
      # Optional: NETLENS_RANGES, NETLENS_QUICK_INTERVAL, NETLENS_DEEP_INTERVAL, NETLENS_TERMINAL
