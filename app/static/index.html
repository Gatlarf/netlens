<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Netlens</title>
  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="css/terminal.css">
  <link rel="stylesheet" href="css/features.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">Netlens</a><span id="app-version" class="app-version"></span>
    <nav id="nav">
      <a class="nav-link" href="#/map" data-route="map">Map</a>
      <a class="nav-link" href="#/devices" data-route="devices">Devices</a>
      <a class="nav-link" href="#/hierarchy" data-route="hierarchy">Hierarchy</a>
      <a class="nav-link" href="#/uptime" data-route="uptime">Uptime</a>
      <a class="nav-link" href="#/stats" data-route="stats">Statistics</a>
      <a class="nav-link" href="#/scans" data-route="scans">Scans &amp; events</a>
      <a class="nav-link" href="#/settings" data-route="settings">Settings</a>
    </nav>
    <div class="topbar-actions">
      <a id="scan-settings" class="btn" href="#/settings/nmap" title="Change which ports and checks nmap uses">&#9881; Scan settings</a>
      <button id="scan-quick" class="btn">Quick scan</button>
      <button id="scan-deep" class="btn">Deep scan</button>
      <button id="logout" class="btn ghost">Log out</button>
      <button id="theme-toggle" class="btn ghost theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">&#9790;</button>
    </div>
  </header>

  <!-- shown only while a scan runs: what it is doing, a progress bar, elapsed time and the usual duration -->
  <div id="scan-info" class="scan-info" hidden>
    <span id="scan-status" class="scan-status"></span>
    <progress id="scan-progress" class="scan-progress" max="100"></progress>
    <span id="scan-time" class="scan-time"></span>
    <button id="scan-cancel" class="btn" type="button">Cancel scan</button>
  </div>

  <main id="view" class="view" tabindex="-1"></main>

  <dialog id="login-dialog">
    <form id="login-form" method="dialog">
      <h2>Sign in</h2>
      <p>Enter the access token configured in NETLENS_TOKEN.</p>
      <label for="login-token">Access token</label>
      <input id="login-token" type="password" autocomplete="current-password" required>
      <p id="login-error" class="error" hidden></p>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
  </dialog>

  <div id="toasts"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
