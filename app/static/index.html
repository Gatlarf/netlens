<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Netlens</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="alternate icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="css/terminal.css">
  <link rel="stylesheet" href="css/features.css">
  <link rel="stylesheet" href="css/phone.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <a class="brand" href="#/"><img class="brand-icon" src="img/favicon.svg" alt="" width="24" height="24">Netlens</a>
    <nav id="nav" class="nav" aria-label="Pages">
      <a class="nav-link" href="#/map" data-route="map">Map</a>
      <a class="nav-link" href="#/devices" data-route="devices">Devices</a>
      <a class="nav-link" href="#/hierarchy" data-route="hierarchy">Hierarchy</a>
      <a class="nav-link" href="#/uptime" data-route="uptime">Uptime</a>
      <a class="nav-link" href="#/services" data-route="services">Services</a>
      <a class="nav-link" href="#/stats" data-route="stats">Statistics</a>
      <a class="nav-link" href="#/scans" data-route="scans">Scans &amp; events</a>
      <a class="nav-link" href="#/settings" data-route="settings">Settings</a>
    </nav>
    <div class="topbar-actions">
      <div class="menu-wrap admin-only" id="scan-menu-wrap">
        <button id="scan-menu-btn" class="btn primary" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="scan-menu">Scan &#9662;</button>
        <div id="scan-menu" class="popmenu" hidden>
          <button id="scan-quick" class="menu-item" type="button">Quick scan</button>
          <button id="scan-deep" class="menu-item" type="button">Deep scan</button>
          <hr>
          <a id="scan-settings" class="menu-item" href="#/settings/nmap" title="Change which ports and checks nmap uses">&#9881; Scan settings</a>
        </div>
      </div>
      <button id="theme-toggle" class="btn ghost theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">&#9790;</button>
      <div class="menu-wrap" id="user-menu-wrap">
        <button id="user-menu-btn" class="btn user-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="user-menu"><span id="user-name">Account</span> &#9662;</button>
        <div id="user-menu" class="popmenu" hidden>
          <div class="menu-who" id="user-who"></div>
          <hr>
          <a class="menu-row version-link" href="#/settings/about" title="About this version and what changed"><span>Version</span><span id="app-version" class="app-version"></span></a>
          <a id="update-badge" class="menu-row update-badge" href="#/settings/about" hidden></a>
          <hr>
          <button id="logout" class="menu-item" type="button">Log out</button>
        </div>
      </div>
      <button id="nav-toggle" class="btn burger" type="button" aria-label="Menu" aria-expanded="false" aria-controls="nav">&#9776;</button>
    </div>
  </header>

  <!-- shown only while a scan runs: what it is doing, a progress bar, elapsed time and the usual duration -->
  <div id="scan-info" class="scan-info" hidden>
    <span id="scan-status" class="scan-status"></span>
    <progress id="scan-progress" class="scan-progress" max="100"></progress>
    <span id="scan-time" class="scan-time"></span>
    <button id="scan-cancel" class="btn admin-only" type="button">Cancel scan</button>
  </div>

  <main id="view" class="view" tabindex="-1"></main>

  <dialog id="login-dialog">
    <form id="login-form" method="dialog">
      <h2>Sign in</h2>
      <div id="login-token-fields">
        <p>Enter the access token configured in NETLENS_TOKEN.</p>
        <label for="login-token">Access token</label>
        <input id="login-token" type="password" autocomplete="current-password">
      </div>
      <div id="login-user-fields" hidden>
        <label for="login-user">User name</label>
        <input id="login-user" type="text" autocomplete="username">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" autocomplete="current-password">
      </div>
      <p id="login-error" class="error" hidden></p>
      <button class="btn primary" type="submit">Sign in</button>
      <button id="login-switch" class="btn ghost" type="button">Sign in with a user name instead</button>
    </form>
  </dialog>

  <div id="toasts"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
