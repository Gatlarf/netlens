# Add this job to your prometheus.yml. Netlens needs the same token as its API.
scrape_configs:
  - job_name: netlens
    metrics_path: /metrics
    scrape_interval: 60s
    authorization:
      type: Bearer
      credentials: YOUR_NETLENS_TOKEN
    static_configs:
      - targets: ["192.168.0.189:8080"]

