# NetLens LAN scanner service
# Uses host networking for raw L2/ARP access and mDNS/SSDP discovery.
# File capabilities on nmap require NET_RAW and NET_ADMIN; no-new-privileges
# would prevent those capabilities from being honored, so it is intentionally omitted.

services:
  netlens:
    # The published image: `docker compose pull && docker compose up -d` updates it. To build from this source tree instead
    # (developers), add the override file: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    image: ghcr.io/gatlarf/netlens:${NETLENS_IMAGE_TAG:-latest}
    container_name: netlens
    restart: unless-stopped

    # Host network mode is required for ARP/L2 discovery and mDNS/SSDP.
    # The app listens on NETLENS_BIND (default 0.0.0.0:8080) on the Docker host.
    network_mode: host

    # Drop all capabilities by default, then add only those needed for raw sockets
    # and network administration (required for nmap file capabilities to work).
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
      - NET_ADMIN

    # Read-only root filesystem for security; /tmp is writable via tmpfs.
    read_only: true
    tmpfs:
      - "/tmp"

    # Persistent storage: a Docker volume called "netlens-data" (nothing to create, no permissions to set).
    # To keep the data in a folder of your own instead, set NETLENS_DATA in .env, for example NETLENS_DATA=/srv/netlens
    # (create it first and run: sudo chown 10001:10001 /srv/netlens).
    volumes:
      - "${NETLENS_DATA:-netlens-data}:/data"

    # Everything below is optional and can be set in a .env file next to this one. Without a .env it just works.
    environment:
      # Optional access token (signs in as administrator). Leave it empty to create your own account in the first-start wizard.
      TZ: ${TZ:-UTC}
      NETLENS_TOKEN: ${NETLENS_TOKEN:-}
      # Optional scan ranges; empty string means auto-detect.
      NETLENS_RANGES: ${NETLENS_RANGES:-}
      # Quick scan interval in seconds (default 15 minutes).
      NETLENS_QUICK_INTERVAL: ${NETLENS_QUICK_INTERVAL:-900}
      # Deep scan interval in seconds (default 24 hours).
      NETLENS_DEEP_INTERVAL: ${NETLENS_DEEP_INTERVAL:-86400}
      # Enable terminal UI (on/off).
      NETLENS_TERMINAL: ${NETLENS_TERMINAL:-on}
      NETLENS_TERMINAL_REMOTE: ${NETLENS_TERMINAL_REMOTE:-off}
      # Reverse proxies whose X-Forwarded-For is believed (addresses or networks, comma separated). Set this when Netlens is reached
      # through a proxy, so the login throttle counts the real visitor instead of the proxy. Empty = nobody is trusted.
      NETLENS_TRUSTED_PROXIES: ${NETLENS_TRUSTED_PROXIES:-}
      # Serve the API documentation pages (/docs, /redoc, /openapi.json). Off by default.
      NETLENS_API_DOCS: ${NETLENS_API_DOCS:-off}
      # Bind address for the web server (default 0.0.0.0:8080).
      NETLENS_BIND: ${NETLENS_BIND:-0.0.0.0:8080}

  # Optional: the helper that lets Netlens open RDP (Windows) and VNC sessions in the browser (Network -> Remote access).
  # SSH and Telnet need nothing extra. Remove the leading "#" of the next lines to switch it on, then `docker compose up -d`.
  # It only listens on this machine (127.0.0.1), where Netlens (host network) finds it by default. NETLENS_GUACD changes the address.
  #
  # guacd:
  #   image: guacamole/guacd:1.5.5
  #   container_name: netlens-guacd
  #   restart: unless-stopped
  #   ports:
  #     - "127.0.0.1:4822:4822"

  # Recommended for a company: run plugins in a container of their own that holds none of Netlens' secrets (docs/PLUGIN-RUNNER.md).
  # Remove the leading "#" of these lines, put NETLENS_RUNNER_TOKEN (openssl rand -hex 32) in .env, add
  #   NETLENS_PLUGIN_RUNNER: http://127.0.0.1:8099   and   NETLENS_RUNNER_TOKEN: ${NETLENS_RUNNER_TOKEN}
  # to the environment of netlens above, then `docker compose up -d`.
  #
  # plugin-runner:
  #   image: ghcr.io/gatlarf/netlens:${NETLENS_IMAGE_TAG:-latest}
  #   container_name: netlens-plugin-runner
  #   restart: unless-stopped
  #   command: ["python", "-m", "app.plugins.runner_server"]
  #   read_only: true
  #   tmpfs: ["/tmp"]
  #   cap_drop: [ALL]
  #   security_opt: ["no-new-privileges:true"]
  #   environment:
  #     NETLENS_RUNNER_TOKEN: ${NETLENS_RUNNER_TOKEN:?set a long random value in .env}
  #   ports:
  #     - "127.0.0.1:8099:8099"

volumes:
  netlens-data:
